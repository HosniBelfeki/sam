apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-oidc-script
data:
  server.py: |
    import json
    import time
    import jwt
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # The signing key is generated fresh on every start and the JWKS derived from
    # it, so no private key ships in this manifest. Even so: this issuer signs any
    # identity it is asked for. Never point a reachable control plane at it.
    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric import rsa

    def _b64url_uint(n):
        import base64
        raw = n.to_bytes((n.bit_length() + 7) // 8, 'big')
        return base64.urlsafe_b64encode(raw).rstrip(b'=').decode('ascii')

    _KEY = rsa.generate_private_key(public_exponent=65537, key_size=2048)
    PRIVATE_KEY = _KEY.private_bytes(
        serialization.Encoding.PEM,
        serialization.PrivateFormat.PKCS8,
        serialization.NoEncryption(),
    )
    _PUB = _KEY.public_key().public_numbers()
    JWKS = {
      "keys": [
        {
          "kty": "RSA",
          "alg": "RS256",
          "use": "sig",
          "kid": "test-key-id",
          "n": _b64url_uint(_PUB.n),
          "e": _b64url_uint(_PUB.e),
        }
      ]
    }

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/.well-known/openid-configuration':
                body = {
                    'issuer': 'http://mock-oidc:18080',
                    'authorization_endpoint': 'http://mock-oidc:18080/auth',
                    'token_endpoint': 'http://mock-oidc:18080/token',
                    'jwks_uri': 'http://mock-oidc:18080/keys'
                }
                data = json.dumps(body).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(data)))
                self.end_headers()
                self.wfile.write(data)
                return
            if self.path == '/keys':
                data = json.dumps(JWKS).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(data)))
                self.end_headers()
                self.wfile.write(data)
                return
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b'ok')

        def do_POST(self):
            if self.path == '/token':
                payload = {
                    'iss': 'http://mock-oidc:18080',
                    'aud': 'sam-e2e',
                    'sub': 'test-user',
                    'exp': int(time.time()) + 3600,
                    'roles': ['admin', 'user']
                }
                token = jwt.encode(payload, PRIVATE_KEY, algorithm='RS256', headers={'kid': 'test-key-id'})
                body = {
                    'access_token': token,
                    'token_type': 'Bearer',
                    'expires_in': 3600
                }
                data = json.dumps(body).encode('utf-8')
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(data)))
                self.end_headers()
                self.wfile.write(data)
                return
            self.send_response(404)
            self.end_headers()

    print("Mock OIDC server ready", flush=True)
    HTTPServer(('0.0.0.0', 18080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
      - name: mock-oidc
        image: python:3.12
        command: ["sh", "-c", "pip install pyjwt cryptography && python /app/server.py"]
        volumeMounts:
        - name: script-volume
          mountPath: /app
      volumes:
      - name: script-volume
        configMap:
          name: mock-oidc-script
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
spec:
  type: LoadBalancer
  ports:
  - port: 18080
    targetPort: 18080
  selector:
    app: mock-oidc
