apiVersion: v1
kind: Secret
metadata:
  name: sam-control-plane-secret
type: Opaque
stringData:
  SAM_OIDC_ISSUER: "http://mock-oidc:18080"
  # Authenticates the policy admin API. Replace before using this outside a demo.
  SAM_ADMIN_TOKEN: "replace-me-with-a-generated-token"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-control-plane
  labels:
    app: sam-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-control-plane
  template:
    metadata:
      labels:
        app: sam-control-plane
    spec:
      containers:
      - name: sam-control-plane
        image: sam-control-plane:local
        imagePullPolicy: IfNotPresent
        args:
        - "--bind-address=0.0.0.0:8080"
        - "--db-driver=sqlite"
        - "--db-dsn=/data/control-plane.db"
        - "--issuer=$(SAM_OIDC_ISSUER)"
        - "--allowed-audiences=sam-mesh-audience,sam-control-plane-audience"
        - "--insecure-skip-tls-verify"
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SAM_OIDC_ISSUER
          valueFrom:
            secretKeyRef:
              name: sam-control-plane-secret
              key: SAM_OIDC_ISSUER
        - name: SAM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: sam-control-plane-secret
              key: SAM_ADMIN_TOKEN
        volumeMounts:
        - name: db-data
          mountPath: /data
      volumes:
      - name: db-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sam-control-plane
spec:
  type: ClusterIP
  selector:
    app: sam-control-plane
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    name: http
---
# The control plane starts default closed: it has no policy until one is posted.
# Seed it over the admin API, which is the only way policy is ever set.
apiVersion: batch/v1
kind: Job
metadata:
  name: sam-control-plane-seed-policy
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: curlimages/curl:8.6.0
        env:
        - name: SAM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: sam-control-plane-secret
              key: SAM_ADMIN_TOKEN
        command:
        - sh
        - -c
        - |
          set -eu
          until curl -sf -o /dev/null http://sam-control-plane:8080/healthz; do sleep 2; done
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SAM_ADMIN_TOKEN}" \
            -d '{
              "roles": [
                {"name": "public-mesh", "allowed_services": ["*"], "allowed_targets": ["*"]}
              ],
              "bindings": [
                {"role": "public-mesh", "members": ["sam:system:authenticated"]}
              ]
            }' \
            http://sam-control-plane:8080/policies
