<!doctype html>
<html lang="{{ .Site.Language.Lang }}" class="no-js">

<head>
  {{ partial "head.html" . }}
</head>

<body class="sam-landing-page">
  <div class="mesh-grid"></div>
  <div class="mesh-glow-cyan"></div>
  <div class="mesh-glow-yellow"></div>

  <div class="landing-container" style="flex-direction: column; text-align: center; max-width: 1000px; margin-top: 2rem;">
    <!-- Top Row: Hero Branding -->
    <div class="hero-brand-col" style="align-items: center; margin-bottom: 3rem;">
      <h1 class="landing-title">SAM</h1>
      <p class="landing-subtitle">Sovereign Agent Mesh</p>
      <p class="landing-description" style="text-align: center; max-width: 600px; margin-left: auto; margin-right: auto;">
        A zero-config, zero-trust decentralized P2P network built specifically for autonomous AI agents.
      </p>

      <div class="landing-actions" style="justify-content: center;">
        <a href="{{ "/docs/" | relURL }}" class="btn-sleek btn-cyan">Enter Mesh Docs</a>
        <a href="{{ .Site.Params.github_repo }}" target="_blank" rel="noopener" class="btn-sleek btn-dark">GitHub</a>
      </div>
    </div>

    <!-- Bottom Row: Demo Player -->
    <link rel="stylesheet" href="{{ "vendor/asciinema-player/asciinema-player.css" | relURL }}">
    <div style="width: 100%;">
      <div id="demo-player" data-cast="{{ "demo.cast" | relURL }}" style="border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.15);"></div>
    </div>
    <script src="{{ "vendor/asciinema-player/asciinema-player.min.js" | relURL }}"></script>
    <script>
      var demoEl = document.getElementById('demo-player');
      AsciinemaPlayer.create(demoEl.dataset.cast, demoEl, {
        speed: 2.5,
        idleTimeLimit: 2,
        autoPlay: true,
        loop: true,
        preload: true,
        fit: 'width'
      });
    </script>
  </div>

  {{ partial "scripts.html" . }}
</body>

</html>
