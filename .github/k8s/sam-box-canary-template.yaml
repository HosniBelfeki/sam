apiVersion: v1
kind: ConfigMap
metadata:
  name: sam-canary-box-config-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
data:
  sam-node.yaml: |
    version: "v1alpha1"
    attenuation:
      policies: []
      checks: []
      rules: []
    services: []
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sam-box-sa
  namespace: sam-canary-${ENV_NAME}
---
# Canary for the sandbox datapath: an agent holding no credential reaches an
# allowlisted destination through the boundary, and nothing else.
#
# The node enrols and owns the mesh identity; sam-box consumes it over the API
# socket and serves the sandbox; the agent speaks plain SOCKS5. All that is
# shared between them is the socket, which is the point of the arrangement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: box-canary-${ENV_NAME}
  namespace: sam-canary-${ENV_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: box-canary-${ENV_NAME}
  template:
    metadata:
      labels:
        app: box-canary-${ENV_NAME}
    spec:
      serviceAccountName: sam-box-sa
      containers:
      - name: sam-node
        image: ghcr.io/google/sam-node:${IMAGE_TAG}
        args:
          - "run"
          - "--config=/etc/sam/sam-node.yaml"
          - "--control-plane=http://sam-control-plane-${ENV_NAME}.${NAMESPACE}.svc.cluster.local:8080"
          - "--jwt-path=/var/run/secrets/tokens/sam-token"
          # Socket only: with no TCP listener there is no API token to leak, and
          # the socket's permissions are the credential.
          - "--bind-addr="
          - "--socket-path=/var/run/sam/node.sock"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/sam
        - name: sam-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        - name: sam-uds
          mountPath: /var/run/sam
      - name: sam-box
        image: ghcr.io/google/sam-box:${IMAGE_TAG}
        args:
          - "run"
          - "--socket=/var/run/sam/agent.sock"
          - "--sidecar-socket=/var/run/sam/node.sock"
          - "--egress-allow=example.com"
          - "--log-level=debug"
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: sam-uds
          mountPath: /var/run/sam
      # Stands in for the tun2socks a real sandbox runs: the boundary is reached
      # over a socket, and an ordinary client needs a TCP address.
      - name: socks-bridge
        image: alpine/socat:1.8.0.0
        args: ["TCP-LISTEN:1080,fork,reuseaddr", "UNIX-CONNECT:/var/run/sam/agent.sock"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: sam-uds
          mountPath: /var/run/sam
      - name: agent
        image: alpine/curl:8.12.1
        command:
          - "sh"
          - "-c"
          - |
            while true; do
              echo "allowlisted destination (expect 200): $(curl -s -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:1080 http://example.com/)"
              echo "the node's own API (expect 403): $(curl -s -o /dev/null -w '%{http_code}' --socks5-hostname 127.0.0.1:1080 http://mesh.sam.alt/sam/service/register)"
              curl -s -o /dev/null --socks5-hostname 127.0.0.1:1080 http://blocked.example/ && echo "unlisted destination was NOT refused" || echo "unlisted destination refused (expected)"
              sleep 30
            done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: sam-uds
        emptyDir: {}
      - name: config-volume
        configMap:
          name: sam-canary-box-config-${ENV_NAME}
      - name: sam-token
        projected:
          sources:
          - serviceAccountToken:
              path: sam-token
              expirationSeconds: 3600
              audience: "sam-control-plane-audience"
