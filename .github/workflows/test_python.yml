name: Python SDK Test

on:
  push:
    branches: [ main ]
    paths:
      - 'sam-mcp-python/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sam-mcp-python/**'

jobs:
  test_python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
      with:
        go-version: '1.22'

    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.4.0
      with:
        python-version: '3.10'

    - name: Run Python unit tests
      run: make test-python

