name: chart-test

on:
  push:
    branches:
      - "main"
    paths:
      - "charts/**"
      - ".github/workflows/chart-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart_test:
    runs-on: ubuntu-22.04
    name: Chart lint and unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint chart
        run: make helm-lint

      - name: Run chart unit tests
        run: make helm-test
