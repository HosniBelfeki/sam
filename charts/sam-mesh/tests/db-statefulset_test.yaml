suite: db statefulset
templates:
  - templates/db-statefulset.yaml
release:
  name: sam-mesh
tests:
  - it: probes postgres with pg_isready
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: pg_isready
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[0]
          value: pg_isready

  - it: scheduling knobs pass through to the pod spec
    set:
      database.postgres.tolerations:
        - key: dedicated
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated

  - it: external postgres renders nothing
    set:
      database.postgres.deployInternal: false
    asserts:
      - hasDocuments:
          count: 0
