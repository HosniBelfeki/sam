suite: bootstrap job
templates:
  - templates/bootstrap-job.yaml
release:
  name: sam-mesh
tests:
  - it: role only touches the router-token secret
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules[0].verbs
          value: [create]
      - equal:
          path: rules[1].resourceNames
          value: [sam-mesh-router-token]
      - equal:
          path: rules[1].verbs
          value: [get, patch, update]
      - lengthEqual:
          path: rules
          count: 2

  - it: job pod runs as the numeric curl uid with resources set
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 100
      - exists:
          path: spec.template.spec.containers[0].resources.limits
