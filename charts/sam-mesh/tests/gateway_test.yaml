suite: gateway
templates:
  - templates/gateway.yaml
release:
  name: sam-mesh
tests:
  - it: disabled by default renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: enabling it requires gateway.className
    set:
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: gateway.className is required when gateway.enabled is true

  - it: routes enrollment plus the console redirect and rewrite by default
    set:
      gateway.enabled: true
      gateway.className: x
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      # enrollment surface + consolePath 302 + consolePath URLRewrite
      - lengthEqual:
          path: spec.rules
          count: 3

  - it: empty consolePath leaves the console unrouted
    set:
      gateway.enabled: true
      gateway.className: x
      gateway.consolePath: ""
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1

  - it: adminRoute adds the /admin rule
    set:
      gateway.enabled: true
      gateway.className: x
      gateway.adminRoute: true
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 4
      - contains:
          path: spec.rules[1].matches
          content:
            path:
              type: PathPrefix
              value: /admin
