global:
  imageTag: local
  imagePullPolicy: IfNotPresent

# One Gateway fronting the mesh: the control plane's enrollment surface plus the console
# under gateway.consolePath, mirroring the cloud deployment.
gateway:
  enabled: false
  # Required when enabled. No default: the GatewayClass is provider-specific, e.g.
  # cloud-provider-kind in kind, gke-l7-global-external-managed on GKE.
  className: ""
  # Routes the control plane's /admin API. Dev only; the cloud leaves it unrouted.
  adminRoute: false
  # External prefix the console is served under. The bare prefix 302s to <prefix>/ and a
  # URLRewrite filter (Extended conformance) strips it before the console sees the
  # request, as on the cloud. Empty leaves the console unrouted.
  consolePath: /console
  # listeners, hostnames, addresses and annotations pass through to the Gateway API
  # objects verbatim, so anything the spec allows is expressible. Plain HTTP on 80
  # matching any host suits a local cluster.
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  hostnames: []
  addresses: []
  annotations: {}

controlPlane:
  replicaCount: 2
  image:
    repository: sam-control-plane
  logLevel: info
  # Leave empty to auto-generate a random admin token on first install (kept
  # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
  adminToken: ""
  autoApproveEnrollment: true
  # Only skips TLS verification for the OIDC issuer; leave false unless
  # pointing at a local/dev issuer without a valid certificate.
  insecureSkipTlsVerify: false
  # Required: the chart bundles no identity provider. Point it at your OIDC issuer
  # (comma-separated for more than one); the control plane refuses to start without one.
  oidcIssuer: ""
  allowedAudiences: "sam-mesh-audience,sam-control-plane-audience"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

database:
  type: postgres
  postgres:
    deployInternal: true
    image:
      repository: postgres
      tag: 16-alpine
    user: sam
    # Leave empty to auto-generate a random password on first install (kept
    # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
    password: ""
    database: sam_mesh
    port: 5432
    sslmode: disable
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

router:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
  image:
    repository: sam-router
  useOidcToken: false
  logLevel: info
  # Binds 4501 TCP+UDP on the router's own node and announces /ip4/<node IP>/... for both
  # transports. One router per node.
  hostPort: null
  nodeSelector: {}
  # Overrides the announced multiaddrs; derived from hostPort when left empty.
  externalAddrs: []
  allowLoopback: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 4501

console:
  enabled: true
  replicaCount: 1
  image:
    repository: sam-console
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8081
    nodePort: null

bootstrap:
  bindings: []
  # Services sam:role:node may call
  nodeServices: ["*"]
